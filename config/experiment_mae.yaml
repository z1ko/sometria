# MAE baseline: uniform random masking, pose reconstruction.
# Its only differences from experiment_mamp.yaml are `tau` and `loss_channels`.

dataloader:
  root: data/processed
  human: config/human.yaml
  normalization: stats/opensim_sincos_log_vel_acc_tau_v2/pretrain_v1_train_clean.pt
  batch_size: 32
  num_workers: 4
  window_frames: 240

  train:
    split_set: pretrain_v1
    split: train
    source_datasets: ["AMASS"]

  val:
    split_set: babel_official
    split: val
    source_datasets: ["AMASS"]

encoder:
  num_dofs: 43
  num_features: 5
  patch_size: 8          # 133 ms at 60 Hz; 240 frames -> 30 x 43 = 1290 tokens
  window_frames: 240
  d_model: 256
  depth: 4
  num_heads: 4
  mlp_ratio: 4.0
  dropout: 0.0

model:
  name: masked
  decoder_depth: 2
  mask_ratio: 0.80
  tau: 0.0               # <= 0: uniform random masking
  loss_channels: [0, 1]  # sin, cos -- pose
  lr: 0.001

training:
  seed: 13
  epochs: 10
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  overfit_batches: 0
