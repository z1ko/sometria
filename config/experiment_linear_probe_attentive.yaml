# The attentive probe: the same frozen backbone as experiment_linear_probe.yaml, read by
# a factorized attention over the T x D grid instead of a flat mean. It answers whether
# the DOF axis carries something a mean loses, and its number is only interpretable
# beside the mean probe's -- the pooler adds ~66k trainable parameters, the mean adds 0.

dataloader:
  root: data/processed
  human: config/human.yaml
  normalization: stats/opensim_sincos_log_vel_acc_tau_v2/pretrain_v1_train_clean.pt
  batch_size: 32
  num_workers: 4
  window_frames: 240
  label_set: babel_action_60
  label_min_coverage: 0.15

  train:
    split_set: babel_official
    split: train
    source_datasets: ["AMASS"]

  val:
    split_set: babel_official
    split: val
    source_datasets: ["AMASS"]

# Only read when `model.checkpoint` is null: a pretrained backbone brings its own spec in
# the checkpoint's hparams. Keep it matching the pretraining config anyway, or the
# random-initialization control stops being the same architecture as what it controls for.
encoder:
  num_dofs: 43
  num_features: 5
  patch_size: 8
  window_frames: 240
  d_model: 256
  depth: 8
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0

model:
  name: classifier
  checkpoint: runs/mamp/lightning_logs/version_1/checkpoints/epoch=8-step=6516.ckpt       # e.g. runs/mamp/lightning_logs/version_0/checkpoints/last.ckpt
  encoder: teacher    # which submodule of the checkpoint holds the weights
  pool: attentive_factorized
  lr: 0.001

training:
  seed: 13
  epochs: 20
  monitor: val/map
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  overfit_batches: 0

