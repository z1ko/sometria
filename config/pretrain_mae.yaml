# MAE baseline, at the reference's hyperparameters
# (Mao et al., https://github.com/maoyunyao/MAMP, config/ntu60_xsub_joint/pretrain_mae_*).
# Its only differences from experiment_mamp.yaml are `masking.tau` and `model.target`.

dataloader:
  root: data/processed
  human: config/human.yaml
  normalization: stats/opensim_sincos_log_vel_acc_tau_v2/pretrain_v1_stats_train_clean.pt
  num_workers: 4
  window_frames: 240
  batch_size: 200
  train:
    source_datasets: ["AMASS"]
    split_set: pretrain_v1
    split: train
  val:
    source_datasets: ["AMASS"]
    split_set: babel_official
    split: val

model:
  num_dofs: 43
  num_frames_in_patch: 8
  num_frames: 240
  enc_depth: 8
  dec_depth: 5
  mask_ratio: 0.9
  min_lr_ratio: 0.5
  warmup: 0.05
  weight_decay: 0.05
  mlp_ratio: 4
  channels_input: [0, 1, 2, 3, 4]
  channels_output: [0, 1, 2, 3, 4]
  num_heads: 8
  dim: 256
  lr: 1e-3

training:
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  epochs: 10
  seed: 42
