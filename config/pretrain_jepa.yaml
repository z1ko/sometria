# JEPA pretraining. A deliberate one-axis delta from `pretrain_mae.yaml`: identical
# dataloader, identical masking, identical architecture and optimizer. The only difference
# is what the loss is scored against -- an EMA teacher's embedding rather than the raw
# patch -- so a JEPA-vs-MAE probe comparison attributes the gap to the target and nothing
# else. Keep the two files in sync when either changes.

dataloader:
  root: data/processed
  human: config/human.yaml
  normalization: stats/opensim_sincos_log_vel_acc_tau_v2/pretrain_v1_stats_train_clean.pt
  num_workers: 4
  window_frames: 240
  batch_size: 200
  train:
    source_datasets: ["AMASS"]
    split_set: pretrain_v1
    split: train
  val:
    source_datasets: ["AMASS"]
    split_set: babel_official
    split: val

model:
  name: jepa
  num_dofs: 43
  num_frames_in_patch: 8
  num_frames: 240
  enc_depth: 8
  # Predictor depth and width. S-JEPA Table 7 sweeps depth 4-7 and width 64-512 and lands
  # on 5 and 256, which these already are. The whole sweep spans 0.3 points; do not tune.
  dec_depth: 5
  mask_ratio: 0.9
  min_lr_ratio: 0.5
  warmup: 0.05
  weight_decay: 0.05
  mlp_ratio: 4
  # No `channels_output`: JEPA reconstructs no channel. The encoder still reads all five.
  channels_input: [0, 1, 2, 3, 4]
  num_heads: 8
  dim: 256
  # Scaled to this repo's run length, not copied from the paper. An EMA at rate `lambda`
  # averages over ~1/(1-lambda) steps; S-JEPA's 0.9999 spans 10,000 steps, ~5% of its
  # 1200-epoch run. A 100-epoch run here is ~13,600 steps, where 0.9999 would span 74% of
  # training and the teacher would never leave its initialization. 0.998 is the same 5%.
  # Recompute if `training.epochs` changes materially.
  ema_start: 0.998
  ema_stop: 1.0
  lr: 1e-3

training:
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  epochs: 100
  seed: 42
  # NOT `val/loss`. A collapsed JEPA -- student and teacher agreeing on a constant vector --
  # drives the MSE toward zero while learning nothing, so minimizing val/loss selects the
  # worst weights on offer. `loss_over_null` is the loss over what a predictor that emitted
  # the batch mean would score: 1.0 means no learning however small the loss got, and below
  # 1 is real prediction. `monitor_mode` is explicit because train.py's fallback guesses
  # direction from the metric name, and this one does not end in "loss".
  monitor: val/loss_over_null
  monitor_mode: min
