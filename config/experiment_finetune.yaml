# Finetune: the same head as the linear probe, with the backbone training under it.
# Point `checkpoint` at a pretraining run; the backbone spec travels in its hparams, so
# the `encoder` block below only has to match for a run trained from scratch -- and that
# run is the control this experiment needs, because a finetune that beats a from-scratch
# model by nothing has shown the pretraining was worth nothing.

dataloader:
  root: data/processed
  human: config/human.yaml
  # Overridden per corpus by scripts/finetune_matrix.sh, which reads it out of the corpus
  # config. A backbone fed windows normalized by other statistics than it pretrained under
  # is offset silently and without error, so this default is only right for amass_clean.
  normalization: stats/opensim_sincos_log_vel_acc_tau_v2/pretrain_v1_stats_train_clean.pt
  batch_size: 128
  num_workers: 4
  window_frames: 240
  label_set: babel_action_60
  label_min_coverage: 0.15

  train:
    split_set: babel_official
    split: train
    source_datasets: ["AMASS"]

  val:
    split_set: babel_official
    split: val
    source_datasets: ["AMASS"]

# Only read when `model.checkpoint` is null: a pretrained backbone brings its own spec in
# the checkpoint's hparams. Keep it matching the pretraining config anyway, or the
# random-initialization control stops being the same architecture as what it controls for.
encoder:
  num_dofs: 43
  num_features: 5
  patch_size: 8
  window_frames: 240
  d_model: 256
  depth: 8
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0

# Defaults follow MAE's end-to-end finetune recipe (arXiv:2111.06377, Table 9): AdamW at
# base lr 1e-3 with layer-wise decay 0.75, weight decay 0.05, 5% warmup, cosine to zero.
# The head has no rate of its own there and none here -- it sits at the top of the ladder
# where the depth scale is 1, so `lr` is its rate and every block below it is scaled down.
model:
  name: finetune
  # Ignored by scripts/finetune_baseline_mae.py, which takes --checkpoint. Only sometria.train
  # reads it, and that path cannot load the pretraining matrix's checkpoints at all -- see
  # the script's docstring for why.
  checkpoint: null
  encoder: teacher       # sometria.train only: which submodule of the checkpoint holds the weights
  pool: attentive        # "mean" | "mean_max" | "moments" | "attentive" | "attentive_factorized"
  lr: 0.001              # base rate: the head and pooler outright, the blocks after decay
  layer_decay: 0.75      # block k runs at lr * 0.75 ** (depth - k); null falls back to backbone_lr
  backbone_lr: 0.00001   # only read when layer_decay is null. One flat rate low enough for the
                         # bottom block is far too low for the top, which is why layer_decay exists.
  weight_decay: 0.05     # 2-D parameters only, positional tables excluded by name
  min_lr_frac: 0.0       # cosine to zero, unlike a probe -- this one is the final model
  warmup: 0.05

training:
  seed: 13
  # 100, as MAE uses for ViT-B. At 50 both the MAE and JEPA curves were still climbing and
  # flattened only because the schedule had decayed, so the old default reported an underfit
  # model as though it were a converged one.
  epochs: 100
  monitor: val/macro_map
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  overfit_batches: 0
