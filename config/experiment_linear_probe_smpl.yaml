# The SMPL arm's BABEL-60 probe: experiment_linear_probe.yaml against the SMPL corpus.
# Four things differ, and all four are the corpus rather than the benchmark -- the joint
# definition, the statistics the frozen backbone was pretrained under, which samples the
# view holds, and the from-scratch encoder's input shape. The label set, coverage rule,
# pooling and head are untouched, because those are what has to stay equal for the two
# arms' numbers to mean anything side by side.
#
# The split set is `babel_paired`, not `babel_official`: the paired set is BABEL's own
# split restricted to takes both imports produced, so both arms score the same takes.

dataloader:
  root: data/processed
  human: config/smpl.yaml
  normalization: stats/smpl_rot6d_log_vel_acc_v1/pretrain_paired_v1_train_clean.pt
  batch_size: 32
  num_workers: 4
  window_frames: 240
  label_set: babel_action_60
  label_min_coverage: 0.15

  train:
    split_set: babel_paired
    split: train
    source_datasets: ["AMASS-SMPL"]

  val:
    split_set: babel_paired
    split: val
    source_datasets: ["AMASS-SMPL"]

# Only read when `model.checkpoint` is null: a pretrained backbone brings its own spec in
# the checkpoint's hparams. Keep it matching the pretraining config anyway, or the
# random-initialization control stops being the same architecture as what it controls for.
encoder:
  num_dofs: 21
  num_features: 18
  patch_size: 8
  window_frames: 240
  d_model: 256
  depth: 8
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0

model:
  name: classifier
  checkpoint: null       # passed with --checkpoint; a value here is only the from-scratch control's
  encoder: teacher       # which submodule of the checkpoint holds the weights
  pool: mean             # "mean" | "mean_max" | "moments" | "attentive" | "attentive_factorized"
  lr: 0.001

training:
  seed: 13
  epochs: 20
  monitor: val/macro_map
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  overfit_batches: 0
